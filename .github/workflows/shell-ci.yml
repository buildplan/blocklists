name: Shell Script Lint

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  TARGET_SCRIPTS: "cs-db-cleanup.sh crowdsec-db-cleanup.sh"

jobs:
  lint:
    name: Lint & POSIX Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
      - name: Install checkbashisms
        run: sudo apt-get update && sudo apt-get install -y devscripts
      - name: Validate defined scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in $TARGET_SCRIPTS; do
            [ -f "$script" ] || { echo "Missing file: $script"; exit 1; }
            echo "-> ShellCheck ($script)"
            shellcheck --shell=sh "$script"
            echo "-> checkbashisms ($script)"
            checkbashisms -f "$script"
          done
